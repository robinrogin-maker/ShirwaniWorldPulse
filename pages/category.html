<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShirwaniWorldPulse – Category</title>
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="apple-touch-icon" href="../images/logo.png">
<link rel="stylesheet" href="../style.css">
</head>
<body>

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="wrap topbar-inner">

      <!-- FIX5 (مكان أيقونة القسم): الشريط العلوي يعرض شعار الموقع فقط.
           أيقونة القسم انتقلت إلى جانب اسم القسم في ترويسة القسم بالأسفل. -->
      <div class="topbar-brand">
        <a class="logo" href="../index.html" id="logoLink">
          <img src="../images/logo.png"
               alt="ShirwaniWorldPulse"
               class="site-logo"
               id="siteLogo">
        </a>
      </div>

      <nav class="main-nav" id="mainNav"></nav>

      <div class="lang-switch" id="langSwitch">
        <button class="lang-btn" data-lang="ar">Arabic</button>
        <span class="lang-sep">|</span>
        <button class="lang-btn" data-lang="en">English</button>
        <span class="lang-sep">|</span>
        <button class="lang-btn" data-lang="sv">Svenska</button>
      </div>

    </div>

    <!-- ============ GOLDEN SEPARATOR ============ -->
    <div class="ticker-separator"></div>

    <!-- ============ NEWS TICKER ============ -->
    <div class="news-ticker" id="newsTicker"></div>

  </header>

  <!-- ============ CATEGORY HEADER ============ -->
  <section class="wrap cat-header">
    <!-- FIX5 (مكان أيقونة القسم): أيقونة القسم الحقيقية بحجم واضح بجانب اسم القسم. -->
    <div class="cat-head-row">
      <span class="icon-badge cat-head-icon" id="catIconBadge">
        <img class="cat-head-icon-img" id="catIconImg" src="" alt="">
      </span>
      <h1 id="catTitle"></h1>
    </div>
    <p id="catDesc" class="cat-desc-text"></p>
  </section>

  <!-- ============ SUB-NAV (region filter for World) ============ -->
  <div class="wrap sub-nav" id="subNav" style="display:none"></div>

  <!-- ============ SPORT SUB-PAGE TOGGLE (shown on sport category) ============ -->
  <div class="wrap sport-sub-nav" id="sportSubNav" style="display:none">
    <button class="sport-sub-btn active" id="sportSubNewsBtn" onclick="switchSportSub('news')">
      <!-- FIX (تسمية): الصفحة الأولى = أخبار كرة القدم -->
      <span class="sport-sub-icon">⚽</span>
      <span id="sportSubNewsLabel"></span>
    </button>
    <button class="sport-sub-btn" id="sportSubMatchesBtn" onclick="switchSportSub('matches')">
      <span class="sport-sub-icon">📅</span>
      <span id="sportSubMatchesLabel"></span>
    </button>
    <!-- FIX (دمج): «الرياضة العالمية» صارت داخل «الرياضة» نفسها،
         فحُذف الزر الثالث ودُمجت تغذياته مع أخبار الرياضة. -->
  </div>

  <!-- ============ ZODIAC GRID (shown on horoscope category) ============ -->
  <!-- FIX (horoscope): the zodiac signs now sit ABOVE the news list so the
       reader picks a sign first, then scrolls to the related news. -->
  <section class="wrap" id="zodiacGrid" style="display:none">
    <!-- FIX (طلب المستخدم): حُذف رأس القسم (الأيقونة ✨ + العنوان + سطر
         التلميح) نهائياً، وتبدأ بطاقات الأبراج مباشرة. -->
    <div class="zodiac-grid-inner" id="zodiacGridInner"></div>
    <!-- FIX: reading panel filled from the free horoscope API. -->
    <div class="zodiac-reading" id="zodiacReading" style="display:none" aria-live="polite"></div>
    <!-- FIX (الأبراج): خط ذهبي فاصل بين بطاقات الأبراج والأخبار أسفلها. -->
    <hr class="zodiac-divider">
  </section>

  <!-- ============ NEWS GRID ============ -->
  <section class="wrap news-grid" id="catNewsGrid"></section>

  <!-- ============ LIVE SCORES — Redesigned sport matches page ============ -->
  <section class="wrap" id="liveScoresSection" style="display:none">
    <div class="sport-matches-page" id="sportMatchesPage">
      <!-- Date carousel (rendered by JS) -->
      <div class="date-carousel" id="dateCarousel"></div>
      <!-- Filter bar: search + league dropdown -->
      <div class="sport-filter-bar" id="sportFilterBar">
        <input type="text" class="sport-search" id="sportSearch" placeholder="">
        <select class="league-filter" id="leagueFilter"></select>
      </div>
      <!-- Matches container (grouped by league) -->
      <div id="matchesContainer"></div>
      <!-- FIX: جدول ترتيب الفرق (يُرسم بواسطة السكربت) -->
      <div class="standings-block" id="standingsBlock"></div>
    </div>
  </section>

  <!-- ============ MUSIC FAVORITES (shown on music category) ============ -->
  <section class="wrap music-favs-section" id="musicFavsSection" style="display:none">
    <div class="section-head">
      <div style="width:100%;display:flex;justify-content:center;">
        <div class="music-favs-title-frame" id="musicFavsTitleFrame" oncontextmenu="return showMusicContextMenu(event, -1)">
          <span class="icon-badge" style="background:rgba(214,39,40,.14);color:var(--music-red)">🎵</span>
          <span id="musicFavsTitle"></span>
        </div>
      </div>
    </div>
    <div id="musicFavsList" class="music-fav-list"></div>
  </section>

  <!-- ============ MUSIC RIGHT-CLICK CONTEXT MENU ============ -->
  <div id="musicContextMenu" class="music-context-menu" style="display:none">
    <div class="music-ctx-item music-ctx-add" id="musicCtxAdd">🎤 <span id="musicCtxAddLabel"></span></div>
    <div class="music-ctx-item music-ctx-danger music-ctx-remove" id="musicCtxRemove">🗑️ <span id="musicCtxRemoveLabel"></span></div>
    <!-- FIX (إخفاء خبر برقم سري): عنصرا الأخبار داخل القائمة نفسها -->
    <div class="music-ctx-item news-ctx-item news-ctx-hide" id="newsCtxHide" style="display:none">🙈 <span></span></div>
    <div class="music-ctx-item news-ctx-item news-ctx-restore" id="newsCtxRestore" style="display:none">♻️ <span></span></div>
    <!-- FIX (منع كلمة أو رابط): الأمر الثالث — قائمة كلمات/روابط ممنوعة -->
    <div class="music-ctx-item news-ctx-item news-ctx-block" id="newsCtxBlock" style="display:none">⛔ <span></span></div>
  </div>

  <!-- ============ MUSIC PASSWORD MODAL ============ -->
  <div id="musicPasswordModal" class="music-password-modal" style="display:none">
    <div class="music-password-box">
      <div class="music-password-title" id="musicPwdTitle"></div>
      <div class="music-pwd-hint" id="musicPwdHint"></div>
      <input type="password" id="musicPwdInput" class="music-pwd-input" autocomplete="off">
      <div class="music-password-actions">
        <button id="musicPwdSubmit" class="music-pwd-submit"></button>
        <button id="musicPwdCancel" class="music-pwd-cancel"></button>
      </div>
      <div class="music-password-error" id="musicPwdError" style="display:none"></div>
    </div>
  </div>

  <!-- ============ FOOTER (3-column: search+about | copyright | logo) ============ -->
  <footer>
    <div class="wrap footer-row">
      <div class="footer-left" id="footerLeft"></div>
      <div class="footer-center" id="footerCenter"></div>
      <div class="footer-right" id="footerRight"></div>
    </div>
  </footer>

<script src="../news-cache.js"></script>
<script src="../data.js"></script>
<script src="../script.js"></script>
</body>
</html>
