<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <radialGradient id="globeGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2A3A4A"/>
      <stop offset="70%" stop-color="#1A2535"/>
      <stop offset="100%" stop-color="#0D141E"/>
    </radialGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="shirwaniGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="50%" stop-color="#F5E6C8"/>
      <stop offset="100%" stop-color="#E8D5A3"/>
    </linearGradient>
    <linearGradient id="worldpulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#C5A028"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <!-- Globe icon (left side) -->
  <g transform="translate(90, 100)">
    <ellipse cx="0" cy="0" rx="65" ry="22" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.5" transform="rotate(-15)"/>
    <circle cx="0" cy="0" r="45" fill="url(#globeGrad)" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="45" ry="15" fill="none" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.35"/>
    <ellipse cx="0" cy="0" rx="15" ry="45" fill="none" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.35"/>
    <line x1="-45" y1="0" x2="45" y2="0" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.35"/>
    <path d="M-10 -20 Q0 -25 10 -18 Q15 -12 12 -5 Q8 5 -2 8 Q-10 5 -12 -5 Q-14 -12 -10 -20Z" fill="url(#goldGrad)" opacity="0.85"/>
    <path d="M8 -18 Q18 -22 22 -15 Q24 -8 20 -2 Q14 -5 10 -12 Q8 -16 8 -18Z" fill="url(#goldGrad)" opacity="0.8"/>
    <path d="M-8 5 Q0 3 4 10 Q2 18 -6 20 Q-12 18 -12 12 Q-10 7 -8 5Z" fill="url(#goldGrad)" opacity="0.75"/>
    <polyline points="-80,0 -45,0 -35,-15 -25,18 -15,-10 -5,5 5,-5 15,8 25,-12 35,0 80,0" 
              fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFF8E7" opacity="0.9"/>
  </g>

  <!-- Text: Shirwani -->
  <text x="200" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="url(#shirwaniGrad)" letter-spacing="1">Shirwani</text>

  <!-- Text: WorldPulse -->
  <text x="420" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="url(#worldpulseGrad)" letter-spacing="1">WorldPulse</text>
</svg>