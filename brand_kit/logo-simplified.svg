<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Golden gradient for continents/ring -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <!-- Dark globe gradient -->
    <radialGradient id="globeGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2A3A4A"/>
      <stop offset="70%" stop-color="#1A2535"/>
      <stop offset="100%" stop-color="#0D141E"/>
    </radialGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Orbital ring -->
  <ellipse cx="100" cy="100" rx="80" ry="30" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" transform="rotate(-15, 100, 100)"/>

  <!-- Globe sphere -->
  <circle cx="100" cy="100" r="55" fill="url(#globeGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Globe grid lines -->
  <ellipse cx="100" cy="100" rx="55" ry="18" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4"/>
  <ellipse cx="100" cy="100" rx="18" ry="55" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4"/>
  <line x1="45" y1="100" x2="155" y2="100" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4"/>

  <!-- Stylized continents (simplified Africa/Europe/Asia shapes) -->
  <path d="M85 65 Q95 60 105 68 Q110 75 108 85 Q105 95 95 98 Q88 95 85 85 Q82 75 85 65Z" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M105 70 Q115 65 120 72 Q122 80 118 88 Q112 85 108 78 Q105 72 105 70Z" fill="url(#goldGrad)" opacity="0.85"/>
  <path d="M90 100 Q98 98 102 105 Q100 115 92 118 Q85 115 85 108 Q87 102 90 100Z" fill="url(#goldGrad)" opacity="0.8"/>

  <!-- Heartbeat/EKG line passing through globe -->
  <polyline points="10,100 45,100 55,80 65,120 75,90 85,105 115,95 125,110 135,85 145,100 190,100" 
            fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Center pulse dot -->
  <circle cx="100" cy="100" r="3" fill="#FFF8E7" opacity="0.9"/>
</svg>