<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShirwaniWorldPulse</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="apple-touch-icon" href="images/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ TOP BAR ============ -->
<header class="topbar">
  <div class="wrap topbar-inner">

    <a class="logo" href="index.html" id="logoLink">
      <img src="images/logo.png"
           alt="ShirwaniWorldPulse"
           class="site-logo"
           id="siteLogo">
    </a>

    <nav class="main-nav" id="mainNav"></nav>

    <div class="lang-switch" id="langSwitch">
      <button class="lang-btn" data-lang="ar">Arabic</button>
      <span class="lang-sep">|</span>
      <button class="lang-btn" data-lang="en">English</button>
      <span class="lang-sep">|</span>
      <button class="lang-btn" data-lang="sv">Svenska</button>
    </div>

  </div>

  <!-- ============ GOLDEN SEPARATOR ============ -->
  <div class="ticker-separator"></div>

  <!-- ============ NEWS TICKER ============ -->
  <div class="news-ticker" id="newsTicker"></div>

</header>

  <!-- ============ HERO ============ -->
  <section class="hero wrap">
    <div class="hero-badge"><span class="dot"></span><span id="heroBadge"></span></div>
    <h1 id="heroTitle">ShirwaniWorldPulse</h1>
    <p id="heroDesc"></p>
  </section>

  <!-- ============ SITE CATEGORY CARDS (icons) ============ -->
  <!-- Homepage shows ONLY the section icons. News lives inside each section
       (e.g. World News page), not on the homepage. -->
  <section class="wrap cat-grid" id="categories"></section>


  <!-- FIX (توحيد الصفحات): قائمة الموسيقى ونافذة الرقم السري كانتا في صفحة
       القسم فقط، فنُقلت إلى كل الصفحات حتى تعمل الأوامر في أي مكان. -->
  <!-- ============ MUSIC RIGHT-CLICK / LONG-PRESS CONTEXT MENU ============ -->
  <div id="musicContextMenu" class="music-context-menu" style="display:none">
    <div class="music-ctx-item music-ctx-add" id="musicCtxAdd">🎤 <span id="musicCtxAddLabel"></span></div>
    <div class="music-ctx-item music-ctx-danger music-ctx-remove" id="musicCtxRemove">🗑️ <span id="musicCtxRemoveLabel"></span></div>
    <!-- FIX (إخفاء خبر برقم سري): عنصرا الأخبار داخل القائمة نفسها -->
    <div class="music-ctx-item news-ctx-item news-ctx-hide" id="newsCtxHide" style="display:none">🙈 <span></span></div>
    <div class="music-ctx-item news-ctx-item news-ctx-restore" id="newsCtxRestore" style="display:none">♻️ <span></span></div>
    <!-- FIX (منع كلمة أو رابط): الأمر الثالث — قائمة كلمات/روابط ممنوعة -->
    <div class="music-ctx-item news-ctx-item news-ctx-block" id="newsCtxBlock" style="display:none">⛔ <span></span></div>
  </div>

  <!-- ============ PASSWORD MODAL (music + hidden news) ============ -->
  <div id="musicPasswordModal" class="music-password-modal" style="display:none">
    <div class="music-password-box">
      <div class="music-password-title" id="musicPwdTitle"></div>
      <div class="music-pwd-hint" id="musicPwdHint"></div>
      <input type="password" id="musicPwdInput" class="music-pwd-input" autocomplete="off">
      <div class="music-password-actions">
        <button id="musicPwdSubmit" class="music-pwd-submit"></button>
        <button id="musicPwdCancel" class="music-pwd-cancel"></button>
      </div>
      <div class="music-password-error" id="musicPwdError" style="display:none"></div>
    </div>
  </div>

  <!-- ============ FOOTER (3-column: search+about | copyright | logo) ============ -->
  <footer>
    <div class="wrap footer-row">
      <div class="footer-left" id="footerLeft"></div>
      <div class="footer-center" id="footerCenter"></div>
      <div class="footer-right" id="footerRight"></div>
    </div>
  </footer>

<script src="news-cache.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
